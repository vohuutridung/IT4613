[project]
name = "it4613"
version = "0.1.0"
description = "Independent MIND-large title/abstract and metadata field encoder (15-field, no body)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "transformers>=5.20.2",
]

[project.optional-dependencies]
plm = [
    "sentence-transformers>=5.1",
    "torch==2.9.1+cpu",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
